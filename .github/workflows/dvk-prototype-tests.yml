name: DVK Prototype Tests

on:
  push:
    branches: [main]
    paths:
      - 'code/Prototype/**'
      - '.github/workflows/dvk-prototype-tests.yml'
  pull_request:
    paths:
      - 'code/Prototype/**'
      - '.github/workflows/dvk-prototype-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/Prototype

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: code/Prototype/pyproject.toml

      - name: Install prototype and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run C01-C22 tests
        run: pytest -q

      - name: Show C01-C22 case output
        run: python run_cases.py
