name: DVK Prototype Tests

on:
  push:
    branches: [main]
    paths:
      - 'code/Prototype/**'
      - '.github/workflows/dvk-prototype-tests.yml'
  pull_request:
    paths:
      - 'code/Prototype/**'
      - '.github/workflows/dvk-prototype-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/Prototype

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: code/Prototype/pyproject.toml

      - name: Install prototype and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run all regression tests
        run: pytest -q

      - name: Show v0.5 Gate 1 persistence acceptance
        run: pytest -q -vv tests/test_persistence_v05.py

      - name: Show v0.4 R16-R18 integrated final acceptance
        run: pytest -q -vv tests/test_integrated_v04.py

      - name: Show v0.4 R15 task-code acceptance output
        run: pytest -q -vv tests/test_task_code_resolution_v04.py

      - name: Show v0.4 R14 staffing acceptance output
        run: pytest -q -vv tests/test_staffing_v04.py

      - name: Show v0.4 R13 Vrijwilligers acceptance output
        run: pytest -q -vv tests/test_vrijwilligers_v04.py tests/test_vrijwilligers_client_v04.py

      - name: Show v0.4 R12 ShiftCatalog acceptance output
        run: pytest -q -vv tests/test_shift_catalog_v04.py

      - name: Show v0.4 R10-R11 Programma acceptance output
        run: pytest -q -vv tests/test_programma_adapter_v04.py

      - name: Show C01-C22 acceptance output
        run: python run_cases.py

      - name: Show v0.3 W-case acceptance output
        run: python run_workstream_cases.py

      - name: Show v0.3 I01 import acceptance output
        run: python run_import_cases.py

      - name: Show v0.3 step 4 candidate selection output
        run: python run_candidate_cases.py

      - name: Show v0.3 step 5 prioritization output
        run: python run_priority_cases.py

      - name: Show v0.3 step 6 dashboard output
        run: python run_dashboard.py

      - name: Show v0.3 step 7 proposal and human decision output
        run: python run_proposal_cases.py

      - name: Show v0.3 step 8 DutyAssignment acceptance output
        run: python run_assignment_cases.py

      - name: Show v0.3 step 9 dashboard decision output
        run: python run_dashboard_actions.py

      - name: Show v0.3 integrated final acceptance
        run: python run_integrated_acceptance.py

      - name: Show v0.4 presentation demo
        run: python run_v04_demo.py

      - name: Validate live CKC Sportlink Programma response
        if: github.event_name == 'workflow_dispatch'
        env:
          SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}
        run: python run_programma_live_validation.py
        
      - name: Validate live CKC Sportlink Vrijwilligers response
        if: github.event_name == 'workflow_dispatch'
        env:
          SPORTLINK_CLIENT_ID: ${{ secrets.SPORTLINK_CLIENT_ID }}
        run: python run_vrijwilligers_live_validation.py
